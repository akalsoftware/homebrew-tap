name: Update formulae

# Follows each tool's releases: daily, or on demand. SupaForge's newest
# stable version on npm that is at least a day old — Homebrew refuses npm
# packages younger than that (std_npm_args sets --min-release-age), and a
# release's own dependencies are older than the release.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      supaforge:
        description: '@akal/supaforge version (empty: npm latest)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: SupaForge
        id: supaforge
        env:
          WANTED: ${{ inputs.supaforge }}
        run: |
          if [ -n "$WANTED" ]; then
            version="$WANTED"
          else
            version="$(npm view @akal/supaforge time --json | node -e '
              const t = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const dayAgo = Date.now() - 24 * 3600 * 1000;
              const ok = Object.entries(t).filter(([v, at]) => /^\d+\.\d+\.\d+$/.test(v) && Date.parse(at) < dayAgo);
              ok.sort((a, b) => Date.parse(a[1]) - Date.parse(b[1]));
              console.log(ok.at(-1)[0]);')"
          fi
          current="$(sed -n 's|.*/supaforge-\(.*\)\.tgz"$|\1|p' Formula/supaforge.rb)"
          echo "current $current, wanted $version"
          if [ "$version" != "$current" ]; then
            scripts/update-formula.sh "$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        id: commit
        if: steps.supaforge.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "supaforge ${{ steps.supaforge.outputs.version }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
